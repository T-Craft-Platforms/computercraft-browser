name: CI/CD

on:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Lint Lua sources
        uses: lunarmodules/luacheck@v1
        with:
          args: '--only 0 -- .'

      - name: Print lint results
        uses: lunarmodules/luacheck@v1
        continue-on-error: true

      - name: Test display selection, rendering, and input
        run: |
          if ! command -v lua5.4 >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y lua5.4
          fi
          lua5.4 tests/display.lua
          lua5.4 tests/awesome.lua
